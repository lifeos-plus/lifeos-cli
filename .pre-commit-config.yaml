minimum_pre_commit_version: 4.5.0
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=error"]
        files: ^scripts/.*\.sh$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the `ruff` pin in pyproject.toml dev dependencies.
    rev: v0.16.2
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
  - repo: local
    hooks:
      - id: locale-catalog-sync
        name: locale-catalog-sync
        entry: uv run python scripts/check_locale_catalog.py
        language: system
        pass_filenames: false
      - id: dead-code
        name: dead-code
        entry: bash ./scripts/dead_code_check.sh
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy src/lifeos_cli tests
        language: system
        pass_filenames: false
